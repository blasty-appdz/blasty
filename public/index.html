<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Theme & App -->
    <meta name="theme-color" content="#1A6EFF" />
    <meta name="application-name" content="Blasty" />
    <meta name="description" content="Réservez vos rendez-vous en quelques secondes — médecins, coiffeurs, restaurants et plus encore. Plateforme algérienne de réservation en ligne." />

    <!-- PWA iOS (Apple) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Blasty" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="%PUBLIC_URL%/icon-144.png" />

    <!-- PWA Android / manifest -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" href="%PUBLIC_URL%/icon-192.png" type="image/png" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Open Graph (partage réseaux sociaux) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://blasty.app/" />
    <meta property="og:title" content="Blasty — Réservation en ligne" />
    <meta property="og:description" content="Réservez vos rendez-vous en quelques secondes. Médecins, coiffeurs, restaurants et plus encore." />
    <meta property="og:image" content="https://blasty.app/icon-512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blasty — Réservation en ligne" />
    <meta name="twitter:description" content="Réservez vos rendez-vous en quelques secondes." />
    <meta name="twitter:image" content="https://blasty.app/icon-512.png" />

    <title>Blasty — Réservez en quelques secondes</title>
  </head>
  <body>
    <noscript>Blasty nécessite JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
